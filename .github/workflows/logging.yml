name: Coordinated logging wheels

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  logging:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: bc8449402b9e0dbe0ea85ff76c954cf36d209f86
          path: .ci/epsm_data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          ref: de1b81a8d9636a4d383559374e51ab89ae8d21f3
          path: .ci/epsm_core
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_rc
          ssh-key: ${{ secrets.EPSM_RC_DEPLOY_KEY }}
          persist-credentials: false
          ref: d8f42ab69e61cfe580f234b20ddc47cf6d056e59
          path: .ci/epsm_rc
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_lca
          ssh-key: ${{ secrets.EPSM_LCA_DEPLOY_KEY }}
          persist-credentials: false
          ref: 00141d0500e717b4f18a9d69e158f0af2aae1934
          path: .ci/epsm_lca
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_db
          ssh-key: ${{ secrets.EPSM_DB_DEPLOY_KEY }}
          persist-credentials: false
          ref: 8e79e13ec0433bc6a1f4d639d8ae2267f798cf16
          path: .ci/epsm_db
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/smhi2epw
          ref: f27d70c8fb665c13ca4263ebe6337f11e45cf73d
          path: .ci/smhi2epw
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_studies
          ssh-key: ${{ secrets.EPSM_STUDIES_DEPLOY_KEY }}
          persist-credentials: false
          ref: 794921797533cfa3d8bde757658fb174932027b5
          path: .ci/epsm_studies
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the coordinated wheels
        run: |
          python -m pip install build pytest nbclient nbformat ipykernel matplotlib
          for package in epsm_data epsm_core epsm_rc epsm_lca epsm_db smhi2epw epsm_studies; do
            python -m build --wheel --outdir .ci/wheels ".ci/$package"
          done
          python -m build --wheel --outdir .ci/wheels .
          python -m pip install .ci/wheels/*.whl
          python -m pip check
          python scripts/verify_logging_installation.py
      - name: Require real handoffs and logging controls
        env:
          EPSM_LOGGING_INTEGRATION: '1'
        run: python -m pytest -o pythonpath= tests/test_logging.py tests/test_logging_handoffs.py -q
      - name: Run logging examples in fresh kernels
        run: python scripts/run_examples.py --logging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logging-python-${{ matrix.python }}
          path: |
            build/logging-verification.json
            build/executed-examples
