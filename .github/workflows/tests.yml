name: EPSM supported package checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  combination:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - id: matrix
        run: python scripts/compatibility_matrix.py >> "$GITHUB_OUTPUT"

  platform:
    needs: combination
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.combination.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_data
          ssh-key: ${{ secrets.EPSM_DATA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_data }}
          path: .ci/epsm_data
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_core
          ssh-key: ${{ secrets.EPSM_CORE_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_core }}
          path: .ci/epsm_core
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_lca
          ssh-key: ${{ secrets.EPSM_LCA_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_lca }}
          path: .ci/epsm_lca
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_rc
          ssh-key: ${{ secrets.EPSM_RC_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_rc }}
          path: .ci/epsm_rc
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_db
          ssh-key: ${{ secrets.EPSM_DB_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_db }}
          path: .ci/epsm_db
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/epsm_studies
          ssh-key: ${{ secrets.EPSM_STUDIES_DEPLOY_KEY }}
          persist-credentials: false
          ref: ${{ matrix.epsm_studies }}
          path: .ci/epsm_studies
      - uses: actions/checkout@v4
        with:
          repository: SB-Chalmers/smhi2epw
          ref: ${{ matrix.smhi2epw }}
          path: .ci/smhi2epw
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build and install the complete wheel combination
        run: |
          python -m pip install build pytest ruff nbclient nbformat ipykernel matplotlib
          for package in epsm_data epsm_core epsm_lca epsm_rc epsm_db epsm_studies smhi2epw; do
            python -m build --wheel --outdir .ci/wheels ".ci/$package"
          done
          python -m build --wheel --outdir .ci/wheels .
          python -m pip install .ci/wheels/*.whl
          python -m pip check
      - name: Check maintained modules and examples
        run: |
          ruff check src/epsm/__init__.py src/epsm/building.py src/epsm/results.py tests examples scripts
          ruff format --check src/epsm/__init__.py src/epsm/building.py src/epsm/results.py tests examples scripts
      - name: Record the actual tested source revisions
        run: python scripts/record_compatibility.py --mode '${{ matrix.mode }}' --output build/compatibility-receipt.json
      - name: Require installed handoffs and execute the platform suite
        run: |
          python scripts/check_installed_platform.py --require-wheels --directory build/installed-handoff
          python -m pytest -q
      - name: Run examples in fresh kernels
        run: python scripts/run_examples.py --integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: epsm-platform-${{ matrix.python }}-${{ matrix.mode }}
          path: |
            build/compatibility-receipt.json
            build/installed-handoff
            build/executed-examples
