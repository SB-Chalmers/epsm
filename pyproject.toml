[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "epsm"
version = "0.2.0"
description = "Researcher-facing EPSM Building, simulations and assessment"
requires-python = ">=3.11"
dependencies = ["epsm_core>=0.3.0", "epsm_data>=0.5.0", "epsm_lca>=0.2.0"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"

[project.optional-dependencies]
rc = ["epsm_rc>=0.3.0"]
database = ["epsm_db>=0.2.0"]
workflows = ["epsm_workflows>=0.2.0"]
examples = ["nbclient>=0.10", "nbformat>=5", "ipykernel>=6", "matplotlib>=3.8"]
all = [
  "epsm_rc>=0.3.0",
  "epsm_db>=0.2.0",
  "epsm_workflows>=0.2.0",
  "epsm_studies>=0.1.0",
  "smhi2epw>=1.1.1",
]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
